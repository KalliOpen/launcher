[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalliopen-launcher"
version = "0.1.0"
description = "KalliOpen local Docker administration application"
requires-python = ">=3.11"

[project.scripts]
kalliopen-launcher = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
