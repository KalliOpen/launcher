name: Build Debian package

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper-compat dh-python pybuild-plugin-pyproject python3-all python3-setuptools python3-build
      - name: Build package
        run: dpkg-buildpackage -us -uc -b
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kalliopen-launcher-deb
          path: ../kalliopen-launcher_*.deb
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ../kalliopen-launcher_*.deb
